name: Build and Release
on:
    push:
        branches:
            - master

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
            - uses: ./.github/workflows/setup
            - run: npm run pub
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
